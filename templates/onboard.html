<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Onboarding</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 640px; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input, textarea, button { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; }
    button { cursor: pointer; background: #1976d2; color: white; border: none; }
    button.secondary { background: #555; }
    .note { font-size: 0.95rem; color: #444; }
    .output { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; min-height: 80px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Device Onboarding</h1>
  <p class="note">Open this page on your partner's phone and enter the Firebase web app config, owner UID, device ID, and the custom token generated by the admin backend.</p>

  <label for="firebase_config">Firebase Web Config (JSON)</label>
  <textarea id="firebase_config" rows="6" placeholder='Paste the Firebase web config JSON here'></textarea>

  <label for="owner_uid">Owner UID</label>
  <input id="owner_uid" placeholder="Owner UID" />

  <label for="device_id">Device ID</label>
  <input id="device_id" placeholder="partner-phone-01" />

  <label for="custom_token">Custom Token</label>
  <textarea id="custom_token" rows="4" placeholder="Paste the custom token here"></textarea>

  <button id="signinButton">Sign in and register device</button>
  <button id="disconnectButton" class="secondary hidden">Sign out</button>

  <div class="output" id="status">Status: waiting for sign in</div>

  <div id="typingSection" class="hidden">
    <label for="typingArea">Type here to save test text to Firestore</label>
    <textarea id="typingArea" rows="6" placeholder="Type a sentence and press Save typing sample."></textarea>
    <button id="saveTypingButton">Save typing sample</button>
    <div class="note">Each saved sample appears in Firestore under <code>devices/{deviceId}/logs</code>.</div>
  </div>

  <script>
    const status = document.getElementById('status');
    const typingSection = document.getElementById('typingSection');
    const signinButton = document.getElementById('signinButton');
    const disconnectButton = document.getElementById('disconnectButton');
    const saveTypingButton = document.getElementById('saveTypingButton');
    const firebaseConfigEl = document.getElementById('firebase_config');
    const ownerUidEl = document.getElementById('owner_uid');
    const deviceIdEl = document.getElementById('device_id');
    const customTokenEl = document.getElementById('custom_token');
    const typingArea = document.getElementById('typingArea');

    function logStatus(message) {
      status.textContent = 'Status: ' + message;
    }

    function loadSaved() {
      firebaseConfigEl.value = localStorage.getItem('firebase_config') || '';
      ownerUidEl.value = localStorage.getItem('onboard_owner_uid') || '';
      deviceIdEl.value = localStorage.getItem('onboard_device_id') || '';
      customTokenEl.value = localStorage.getItem('onboard_custom_token') || '';
    }

    function saveOnboard() {
      localStorage.setItem('firebase_config', firebaseConfigEl.value.trim());
      localStorage.setItem('onboard_owner_uid', ownerUidEl.value.trim());
      localStorage.setItem('onboard_device_id', deviceIdEl.value.trim());
      localStorage.setItem('onboard_custom_token', customTokenEl.value.trim());
    }

    async function signIn() {
      const configText = firebaseConfigEl.value.trim();
      const ownerUid = ownerUidEl.value.trim();
      const deviceId = deviceIdEl.value.trim();
      const customToken = customTokenEl.value.trim();

      if (!configText || !ownerUid || !deviceId || !customToken) {
        logStatus('Fill all fields before signing in.');
        return;
      }

      let firebaseConfig;
      try {
        firebaseConfig = JSON.parse(configText);
      } catch (error) {
        logStatus('Firebase config JSON is invalid.');
        return;
      }

      saveOnboard();
      logStatus('Initializing Firebase...');

      try {
        firebase.initializeApp(firebaseConfig);
      } catch (error) {
        logStatus('Firebase init failed: ' + error.message);
        return;
      }

      try {
        const result = await firebase.auth().signInWithCustomToken(customToken);
        const uid = result.user.uid;
        logStatus('Signed in as ' + uid + '. Registering device...');
        const idToken = await result.user.getIdToken(true);
        const response = await fetch('/register_phone', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            owner_uid: ownerUid,
            device_id: deviceId,
            id_token: idToken,
            info: {
              name: deviceId,
              os: 'mobile-web',
              userAgent: navigator.userAgent,
            },
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || response.statusText);
        }
        typingSection.classList.remove('hidden');
        disconnectButton.classList.remove('hidden');
        signinButton.textContent = 'Refresh device registration';
        logStatus('Signed in and device registered via backend. Type a sample and save.');
      } catch (error) {
        logStatus('Registration failed: ' + error.message);
      }
    }

    async function saveTypingSample() {
      const deviceId = deviceIdEl.value.trim();
      const text = typingArea.value.trim();
      if (!deviceId) {
        logStatus('Device ID is required.');
        return;
      }
      if (!text) {
        logStatus('Type something before saving.');
        return;
      }
      try {
        const user = firebase.auth().currentUser;
        if (!user) {
          logStatus('Please sign in first.');
          return;
        }
        const idToken = await user.getIdToken(true);
        const response = await fetch(`/devices/${encodeURIComponent(deviceId)}/events`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + idToken,
          },
          body: JSON.stringify({
            event_type: 'typing_sample',
            payload: { text },
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || response.statusText);
        }
        logStatus('Typing sample saved via backend.');
        typingArea.value = '';
      } catch (error) {
        logStatus('Failed to save typing sample: ' + error.message);
      }
    }

    async function signOut() {
      try {
        await firebase.auth().signOut();
        typingSection.classList.add('hidden');
        disconnectButton.classList.add('hidden');
        signinButton.textContent = 'Sign in and register device';
        logStatus('Signed out.');
      } catch (error) {
        logStatus('Sign-out failed: ' + error.message);
      }
    }

    signinButton.addEventListener('click', signIn);
    saveTypingButton.addEventListener('click', saveTypingSample);
    disconnectButton.addEventListener('click', signOut);
    loadSaved();
  </script>
</body>
</html>
